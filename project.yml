name: WoofPhoto
options:
  bundleIdPrefix: com.laskywolf
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.5"
    CURRENT_PROJECT_VERSION: "54"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  WoofPhoto:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: WoofPhoto
      - path: Shared
    dependencies:
      - target: WoofPhotoWidget
      - target: WoofPhotoShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.laskywolf.woofphoto
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: WoofPhoto/WoofPhoto.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.laskywolf.woofphoto
    info:
      path: WoofPhoto/Info.plist
      properties:
        CFBundleDisplayName: WoofPhoto
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # Immich servers are often plain HTTP: on an IP address, a .lan name or a VPN.
        # NSAllowsLocalNetworking only covers .local and single-word names, and when it is
        # present iOS ignores NSAllowsArbitraryLoads, so only this key is set.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: WoofPhoto connects to your Immich server on the local network.
        NSPhotoLibraryUsageDescription: WoofPhoto backs up the photos and videos you choose to your Immich server and saves the edits you make to them.
        NSPhotoLibraryAddUsageDescription: WoofPhoto saves photos and videos from your Immich server to this iPhone.
        NSFaceIDUsageDescription: WoofPhoto uses Face ID to open the Hidden album.
        NSAppleMusicUsageDescription: WoofPhoto plays a song you choose under a memory movie.
        CFBundleURLTypes:
          - CFBundleURLName: com.laskywolf.woofphoto
            CFBundleURLSchemes:
              - woofphoto
        BGTaskSchedulerPermittedIdentifiers:
          - com.laskywolf.woofphoto.backup
        UIBackgroundModes:
          - processing
          - fetch
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  WoofPhotoWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: WoofPhotoWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.laskywolf.woofphoto.widget
    entitlements:
      path: WoofPhotoWidget/WoofPhotoWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.laskywolf.woofphoto
    info:
      path: WoofPhotoWidget/Info.plist
      properties:
        CFBundleDisplayName: WoofPhoto
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  # "Upload to Immich" in the share sheet. Reads the server, token and proxy headers through the App Group.
  WoofPhotoShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.laskywolf.woofphoto.share
    entitlements:
      path: ShareExtension/WoofPhotoShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.laskywolf.woofphoto
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Upload to Immich
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # plain HTTP and the local network, as in the app
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: WoofPhoto connects to your Immich server on the local network.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 50
              NSExtensionActivationSupportsMovieWithMaxCount: 50
