name: Native app

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build
        run: |
          xcodebuild -project WoofPhoto.xcodeproj -scheme WoofPhoto -configuration Release \
            -derivedDataPath build -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build

      # An unsigned build carries no entitlements. An ad-hoc signature stores the App Group
      # in the binaries, so the signing tool can see that the app and the widget ask for it.
      - name: Add entitlements
        run: |
          APP=build/Build/Products/Release-iphoneos/WoofPhoto.app
          for f in "$APP"/Frameworks/*; do [ -e "$f" ] && codesign --force --sign - "$f"; done
          codesign --force --sign - --entitlements WoofPhotoWidget/WoofPhotoWidget.entitlements "$APP/PlugIns/WoofPhotoWidget.appex"
          codesign --force --sign - --entitlements WoofPhoto/WoofPhoto.entitlements "$APP"
          codesign -d --entitlements - "$APP"

      - name: Package the IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/WoofPhoto.app Payload/
          zip -qr WoofPhoto.ipa Payload

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: WoofPhoto-native
          path: WoofPhoto.ipa
          retention-days: 1

      # Turns the addresses in a crash report back into function names.
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: WoofPhoto-dSYM
          path: build/Build/Products/Release-iphoneos/WoofPhoto.app.dSYM
          retention-days: 30
